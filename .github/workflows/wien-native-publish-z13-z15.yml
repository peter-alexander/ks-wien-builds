name: Verify and publish stable XYZ Vienna building tiles Z13-Z15
run-name: Publish verified Wiener native 3D XYZ tiles in one commit

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

# Shares the existing gh-pages writer lock with other Vienna publishers.
concurrency:
  group: wien-pages-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          path: sources
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: pages
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            WienBuildings
          sparse-checkout-cone-mode: true
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Retrieve independently validated Z15 complete-city release
        uses: actions/download-artifact@v8
        with:
          name: wien-native-z15-whole-city-678-tiles
          run-id: 41904116043
          github-token: ${{ github.token }}
          path: sources/wien-native-city/build/publish/z15
      - name: Retrieve complete Z14 native LOD1 release
        uses: actions/download-artifact@v8
        with:
          name: wien-native-z14-lod1-whole-city-200-tiles
          run-id: 41975614148
          github-token: ${{ github.token }}
          path: sources/wien-native-city/build/publish/z14
      - name: Retrieve complete Z13 native LOD1 release with bounded chunks
        uses: actions/download-artifact@v8
        with:
          name: wien-native-z13-lod1-baseline-whole-city-62-tiles
          run-id: 41976239777
          github-token: ${{ github.token }}
          path: sources/wien-native-city/build/publish/z13
      - name: Validate all original source revisions and file checksums before touching gh-pages
        working-directory: sources
        run: |
          node --check wien-native-city/package-multizoom-release.mjs
          node --max-old-space-size=6144 wien-native-city/package-multizoom-release.mjs \
            wien-native-city/build/publish/z13 \
            wien-native-city/build/publish/z14 \
            wien-native-city/build/publish/z15 \
            wien-native-city/build/publish/staged \
            2026-11-05-fmzk-native-v1
      - name: Stage verified XYZ tiles and manifest together in one Git commit
        run: |
          set -euo pipefail
          src="sources/wien-native-city/build/publish/staged"
          dest="pages/WienBuildings"
          test -s "$src/release.json"
          test -s "$src/release-z13.json"
          test -s "$src/release-z14.json"
          test -s "$src/release-z15.json"
          test -s "$src/building-index.json.gz"
          # Fully validate the staged output before touching the Pages tree.
          node --input-type=module - "$src" <<'NODE'
          import fs from "node:fs";
          import path from "node:path";
          const root=process.argv[2];
          const meta=JSON.parse(fs.readFileSync(path.join(root,"release.json"),"utf8"));
          if(meta.format!=="KSWN0001" || meta.status!=="complete" ||
              meta.tileRoot!=="tiles/" || meta.versionedPath!==undefined ||
              !meta.cacheVersion || [13,14,15].some(z=>!meta.zoomLevels?.[z])){
              throw new Error("Invalid stable XYZ release metadata");
          }
          let count=0;
          for(const z of [13,14,15]){
              const level=meta.zoomLevels[z];
              const manifest=JSON.parse(fs.readFileSync(path.join(root,level.manifest),"utf8"));
              if(Object.keys(manifest.tiles||{}).length!==level.tiles)throw new Error("Incomplete Z"+z);
              for(const [key,entry] of Object.entries(manifest.tiles)){
                  const files=z===13?entry.chunks.map(chunk=>chunk.key+".check"): [key+".bin.gz"];
                  for(const name of files){
                      const real=name.endsWith(".check")?name.slice(0,-6):name;
                      if(!fs.statSync(path.join(root,"tiles",real)).isFile())
                          throw new Error("Missing verified tile "+real);
                  }
                  count++;
              }
          }
          if(count!==940)throw new Error("Expected 940 native source tiles");
          NODE
          mkdir -p "$dest"
          # All generated tiles are complete here. rsync does not publish a live
          # website; GitHub Pages only sees the subsequent pushed Git commit.
          rsync -a --delete "$src/tiles/" "$dest/tiles/"
          for file in release-z13.json release-z14.json release-z15.json building-index.json.gz release.json; do
            cp "$src/$file" "$dest/$file"
          done
          # Remove all previous release directories. Never publish a second copy.
          rm -rf "$dest/releases" "$dest/Native" "$dest/LOD1" "$dest/LOD21" "$dest/NativePilot"
          git -C pages config user.name 'github-actions[bot]'
          git -C pages config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C pages add -A -- WienBuildings
          if git -C pages diff --cached --quiet; then
            echo "No building changes to publish"
            exit 0
          fi
          git -C pages commit -m "Publish verified native Vienna XYZ Z13-Z15 with one consistent manifest"
          for attempt in 1 2 3 4; do
            git -C pages fetch origin gh-pages
            git -C pages rebase origin/gh-pages
            if git -C pages push origin HEAD:gh-pages; then
              echo "Published one complete Git snapshot"
              exit 0
            fi
            sleep "$((attempt * 5))"
          done
          echo "Could not push Vienna XYZ snapshot without overwriting concurrent updates" >&2
          exit 1
      - name: Report completed publication
        run: |
          echo "Building release URL:" >> "$GITHUB_STEP_SUMMARY"
          echo "https://peter-alexander.github.io/ks-wien-builds/WienBuildings/release.json" >> "$GITHUB_STEP_SUMMARY"
          echo "Z13=62, Z14=200, Z15=678; stable XYZ paths, no release directories, one commit." >> "$GITHUB_STEP_SUMMARY"
