name: Dispatch full verified native Vienna production once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/start-native-full-build-once.yml'
permissions:
  actions: write
  contents: read
jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - name: Start current fully verified six-sheet CityGML workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/actions/workflows/wien-native-production.yml/dispatches" -f ref=main
