name: Build native Vienna Z14 LOD1 pilot directly from official FMZK
run-name: Z14 FMZK two-tile native LOD1 pilot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wien-native-z14-pilot.yml'
      - 'wien-native-city/build-lowzoom.mjs'
      - 'wien-native-city/build-lowzoom.test.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wien-native-z14-pilot
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install unchanged existing native build dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm install --no-save --ignore-scripts --no-audit --no-fund @mapbox/vector-tile@3.0.0 pbf@5.1.2 three@0.186.1
      - name: Verify geometry source schema and zoom-aware native encoder
        run: |
          node --check wien-native-city/build-lowzoom.mjs
          node --test wien-native-city/build-lowzoom.test.mjs wien-native-pilot/build.test.mjs
      - name: Build two neighboring Z14 flat-roof LOD1 tiles from original FMZK Z14 vectors
        run: |
          node wien-native-city/build-lowzoom.mjs 14 \
            wien-native-city/build/z14-pilot \
            14/8936/5680 14/8937/5680
      - name: Verify native geometry and compare with original Z15 triangles
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import {readNativeTile} from "./wien-native-city/native-tile-patch.mjs";
          const root="wien-native-city/build/z14-pilot";
          const manifest=JSON.parse(fs.readFileSync(root+"/manifest.json","utf8"));
          if(manifest.zoom!==14||Object.keys(manifest.tiles).length!==2||
            manifest.parts===0||manifest.triangles===0)throw new Error("Z14 pilot incomplete");
          for(const key of Object.keys(manifest.tiles)){
            const data=readNativeTile(fs.readFileSync(root+"/tiles/"+key+".bin.gz"));
            if(!data.parts.length || data.parts.some(part=>part.info.source!=="lod1")){
              throw new Error("Native pilot contains historical roof geometry");
            }
          }
          console.log("Validated direct Z14 LOD1 pilot:",
            JSON.stringify({parts:manifest.parts,vertices:manifest.vertices,
              triangles:manifest.triangles,gzipBytes:manifest.gzipBytes}));
          NODE
      - name: Retain unpublished native Z14 pilot tiles and measurements
        uses: actions/upload-artifact@v6
        with:
          name: wien-native-z14-lod1-pilot
          path: wien-native-city/build/z14-pilot/
          retention-days: 21
          compression-level: 0
          if-no-files-found: error
