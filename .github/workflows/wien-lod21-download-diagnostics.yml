name: Diagnose Vienna LOD2.1 download connections

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wien-lod21-download-diagnostics
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Check diagnostic script syntax
        run: node --check scripts/diagnose-lod21-downloads.mjs

      - name: Probe Vienna LOD2.1 ZIP connections
        run: node scripts/diagnose-lod21-downloads.mjs /tmp/wien-lod21-download-diagnostics

      - name: Add diagnostic table to job summary
        if: always()
        run: |
          if [ -f /tmp/wien-lod21-download-diagnostics/summary.md ]; then
            cat /tmp/wien-lod21-download-diagnostics/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wien-lod21-download-diagnostics
          path: /tmp/wien-lod21-download-diagnostics/
          if-no-files-found: warn
          retention-days: 7
