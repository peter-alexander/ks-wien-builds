name: Inspect official Vienna LOD2.4 test sample structure

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wien-lod24-sample-probe.yml'

permissions:
  contents: read

jobs:
  sample-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Fetch public official sample page and identify sample links
        run: |
          python3 - <<'PY'
          import html
          import json
          import urllib.request
          from html.parser import HTMLParser
          from urllib.parse import urljoin,urlparse

          url="https://www.wien.gv.at/stadtplanung/detailliertes-dachmodell-daten-beziehen"
          request=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 Kartensammlung source schema inspection"})
          with urllib.request.urlopen(request,timeout=45) as response:
              body=response.read().decode("utf-8","replace")

          class Anchors(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.links=[]
                  self.href=None
                  self.text=[]
              def handle_starttag(self,tag,attrs):
                  if tag=="a":
                      self.href=dict(attrs).get("href")
                      self.text=[]
              def handle_data(self,data):
                  if self.href is not None:
                      self.text.append(data)
              def handle_endtag(self,tag):
                  if tag=="a" and self.href is not None:
                      self.links.append((self.href," ".join(self.text)))
                      self.href=None
          parser=Anchors()
          parser.feed(body)
          selected=[]
          for href,label in parser.links:
              full=urljoin(url,href)
              if urlparse(full).hostname not in ("www.wien.gv.at","wien.gv.at"):
                  continue
              if (".zip" in href.lower() or "dachlinien" in label.lower()
                  or "dreiecksvermaschung" in label.lower()):
                  selected.append({"label":html.unescape(label).strip(),"url":full})
          with open("lod24-sample-links.json","w",encoding="utf8") as file:
              json.dump({"officialPage":url,"sampleLinks":selected},file,indent=2,ensure_ascii=False)
          print(json.dumps(selected,ensure_ascii=False,indent=2))
          if not selected:
              raise SystemExit("No official archive link discovered; inspect page markup before importing anything")
          PY

      - name: Inspect archive members only, not redistribute the sample data
        run: |
          python3 - <<'PY'
          import io
          import json
          import urllib.request
          import zipfile

          source=json.load(open("lod24-sample-links.json",encoding="utf8"))
          archives=[]
          for item in source["sampleLinks"][:5]:
              try:
                  request=urllib.request.Request(item["url"],headers={"User-Agent":"Mozilla/5.0"})
                  with urllib.request.urlopen(request,timeout=45) as response:
                      buf=response.read(3000000)
                  if not zipfile.is_zipfile(io.BytesIO(buf)):
                      archives.append({"url":item["url"],"status":"not-a-zip"})
                      continue
                  with zipfile.ZipFile(io.BytesIO(buf)) as archive:
                      entries=[{"name":i.filename,"bytes":i.file_size}
                               for i in archive.infolist() if not i.is_dir()]
                  archives.append({"url":item["url"],"status":"inspected","files":entries})
              except Exception as error:
                  archives.append({"url":item["url"],"status":"inspection-failed","error":str(error)[:350]})
          with open("lod24-sample-inventory.json","w",encoding="utf8") as output:
              json.dump({"source":source,"archives":archives},output,indent=2,ensure_ascii=False)
          print(json.dumps(archives,indent=2,ensure_ascii=False))
          PY

      - name: Identify CityGRID XML roof geometry element types
        run: |
          curl --fail --location --silent --show-error --max-time 60 \
            https://www.wien.gv.at/downloads/ma41/3d-modell-flaechen.zip -o /tmp/lod24.zip
          unzip -p /tmp/lod24.zip '*/3d modell.xml' > /tmp/lod24.xml
          python3 - <<'PY'
          import collections
          import xml.etree.ElementTree as ET
          root=ET.parse("/tmp/lod24.xml").getroot()
          local=lambda name:name.split("}")[-1]
          names=collections.Counter(local(e.tag) for e in root.iter())
          attrs=collections.Counter(local(k) for e in root.iter() for k in e.attrib)
          print("CityGRID root:",local(root.tag))
          print("XML tag counts:",names.most_common(45))
          print("XML attributes:",attrs.most_common(25))
          PY

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: wien-lod24-official-demo-file-inventory
          path: |
            lod24-sample-links.json
            lod24-sample-inventory.json
          if-no-files-found: warn
          retention-days: 14
