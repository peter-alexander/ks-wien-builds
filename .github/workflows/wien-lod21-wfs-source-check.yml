name: Check three missing Vienna FMZK hybrid source IDs

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/wien-lod21-wfs-source-check.yml'
      - 'wien-lod21/check-missing-current.mjs'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
      - name: Syntax check
        run: node --check wien-lod21/check-missing-current.mjs
      - name: Query missing IDs separately in both FMZK layers
        run: node wien-lod21/check-missing-current.mjs
