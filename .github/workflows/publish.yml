name: Build and publish Vienna data to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      dataset:
        description: Dataset to build and publish
        type: choice
        required: true
        options:
          - baumkataster
          - buildings
          - stadtplan
  schedule:
    - cron: '37 2 * * *'
    - cron: '23 3 * * 2,5'
    - cron: '19 0 * * *'

permissions:
  contents: write

concurrency:
  group: wien-pages-publish
  cancel-in-progress: false

jobs:
  build-publish:
    runs-on: ubuntu-latest
    env:
      DATASET: ${{ github.event_name == 'workflow_dispatch' && inputs.dataset || (github.event.schedule == '37 2 * * *' && 'baumkataster' || github.event.schedule == '19 0 * * *' && 'stadtplan' || 'buildings') }}
      WIEN_LOD21_TARGETS: wien-lod21/targets.production.json
    steps:
      - uses: actions/checkout@v4
        with:
          path: sources
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version-file: sources/.nvmrc
          cache: npm
          cache-dependency-path: sources/package-lock.json

      - name: Install dependencies
        if: env.DATASET != 'stadtplan'
        working-directory: sources
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          sudo apt-get update
          sudo apt-get install -y build-essential libsqlite3-dev zlib1g-dev unzip

      - name: Cache tippecanoe
        if: env.DATASET == 'baumkataster' || env.DATASET == 'buildings'
        id: tippecanoe-cache
        uses: actions/cache@v4
        with:
          path: sources/.local/bin
          key: ${{ runner.os }}-wien-tippecanoe-v1

      - name: Build tippecanoe
        if: (env.DATASET == 'baumkataster' || env.DATASET == 'buildings') && steps.tippecanoe-cache.outputs.cache-hit != 'true'
        working-directory: sources
        run: bash .github/scripts/build-tippecanoe.sh

      - name: Build requested dataset
        working-directory: sources
        env:
          TIPPECANOE_BIN: ${{ github.workspace }}/sources/.local/bin/tippecanoe
        run: |
          case "$DATASET" in
            baumkataster)
              bash baumkataster/run.sh
              ;;
            buildings)
              bash wien-buildings/run.sh
              bash wien-lod21/run.sh
              node wien-lod21/validate-production.mjs wien-lod21/build/WienBuildingsLOD21
              ;;
            stadtplan)
              node stadtplan-wien/test.mjs
              node stadtplan-wien/build.mjs
              node stadtplan-wien/validate.mjs
              ;;
            *)
              echo "Unsupported dataset: $DATASET" >&2
              exit 1
              ;;
          esac

      - name: Prepare GitHub Pages files
        run: |
          set -euo pipefail
          case "$DATASET" in
            baumkataster)
              target="pages/Baumkataster"
              source="sources/baumkataster/build/Baumkataster"
              ;;
            stadtplan)
              target="pages/StadtplanWien"
              source="sources/stadtplan-wien/build"
              ;;
            buildings)
              target="pages/WienBuildings"
              source="sources/wien-buildings/build/WienBuildings"
              # GitHub Pages cannot configure Content-Encoding for pre-gzipped PBF.
              # Store actual PBF bytes uncompressed so browsers can parse them.
              find "$source/tiles" -type f -name '*.pbf' -print0 |
                while IFS= read -r -d '' tile; do
                  gzip -dc "$tile" > "$tile.tmp"
                  mv "$tile.tmp" "$tile"
                done
              node -e '
                const fs = require("fs");
                const p = process.argv[1];
                const data = JSON.parse(fs.readFileSync(p, "utf8"));
                data.vectorTiles.compression = "none";
                fs.writeFileSync(p, JSON.stringify(data, null, 2) + String.fromCharCode(10));
              ' "$source/release.json"
              ;;
          esac
          test -d "$source"
          if [ "$DATASET" = "buildings" ]; then
            test -d sources/wien-lod21/build/WienBuildingsLOD21
            mkdir -p "$target/LOD1" "$target/LOD21"
            cp -a "$source/." "$target/LOD1/"
            cp -a sources/wien-lod21/build/WienBuildingsLOD21/. "$target/LOD21/"
            rm -f "$target/LOD1/.htaccess"
          elif [ "$DATASET" = "stadtplan" ]; then
            mkdir -p "$target/releases"
            release_id="$(tr -d '\r\n' < "$source/release-id.txt")"
            test -d "$source/releases/$release_id"
            cp -a "$source/releases/$release_id" "$target/releases/"
            cp "$source/style.json" "$target/style.json"
          else
            mkdir -p "$target"
            cp -a "$source/." "$target/"
          fi
          touch pages/.nojekyll
          echo "PAGES_TARGET=$target" >> "$GITHUB_ENV"

      - name: Update root asset versions
        run: node sources/scripts/update-asset-versions.mjs pages "$DATASET"

      - name: Commit dataset to gh-pages without deleting other datasets
        working-directory: pages
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- "${PAGES_TARGET#pages/}" .nojekyll asset-versions.json
          if git diff --cached --quiet; then
            echo "No changes to publish"
            exit 0
          fi
          git commit -m "Publish Vienna $DATASET data"
          git push origin HEAD:gh-pages
