name: Build and publish independent Vienna Z15 native building pilot

on:
  push:
    branches: [main]
    paths:
      - 'wien-native-pilot/**'
      - '.github/workflows/wien-native-pilot.yml'
  workflow_dispatch:

permissions:
  contents: write

# Serialize gh-pages writes with all existing Vienna data publishers.
concurrency:
  group: wien-pages-publish
  cancel-in-progress: false

jobs:
  native-pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          path: sources
          persist-credentials: false

      - uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: pages
          fetch-depth: 1

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: sources/package-lock.json

      - name: Install geometry conversion dependencies
        working-directory: sources
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm install --no-save --ignore-scripts --no-audit --no-fund @mapbox/vector-tile@3.0.0 pbf@5.1.2 three@0.186.1

      - name: Unit-test native mesh format and fail-closed roof matching
        working-directory: sources
        run: node --test wien-native-pilot/build.test.mjs

      - name: Build nine contiguous Z15 tiles using our published FMZK and historical roof data
        working-directory: sources
        run: node wien-native-pilot/build.mjs

      - name: Verify manifest and all nine tiles
        working-directory: sources
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const root = 'wien-native-pilot/build';
          const data = JSON.parse(fs.readFileSync(root + '/manifest.json', 'utf8'));
          const keys = Object.keys(data.tiles);
          if (keys.length !== 9 || keys.some(key => {
            const tile = data.tiles[key];
            const file = root + '/tiles/' + key + '.bin.gz';
            return !fs.existsSync(file) || tile.gzipBytes !== fs.statSync(file).size
              || tile.lod1Parts <= 0 || tile.vertices <= 0 || tile.triangles <= 0;
          })) {
            throw new Error('Nine complete nonempty Z15 pilot tiles were not produced');
          }
          console.log('Pilot complete:', JSON.stringify(data.tiles, null, 2));
          NODE

      - uses: actions/upload-artifact@v6
        with:
          name: wien-native-gpu-terrain-pilot
          path: sources/wien-native-pilot/build
          if-no-files-found: error
          retention-days: 14

      - name: Stage standalone pilot data only
        run: |
          set -euo pipefail
          mkdir -p pages/WienBuildings/NativePilot
          rsync -a --delete sources/wien-native-pilot/build/ pages/WienBuildings/NativePilot/
          cp sources/wien-native-pilot/view.html pages/WienBuildings/NativePilot/index.html
          touch pages/.nojekyll

      - name: Publish pilot on gh-pages safely
        working-directory: pages
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- WienBuildings/NativePilot .nojekyll
          if git diff --cached --quiet; then
            echo 'No pilot changes to publish'
            exit 0
          fi
          git commit -m 'Publish self-built Vienna native Z15 building pilot'
          for attempt in 1 2 3; do
            git fetch origin gh-pages
            git rebase origin/gh-pages
            if git push origin HEAD:gh-pages; then
              exit 0
            fi
            sleep "$((attempt * 3))"
          done
          echo 'Could not publish pilot safely after retries' >&2
          exit 1
