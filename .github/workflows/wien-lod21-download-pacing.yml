name: Test Vienna LOD2.1 download pacing

on:
  workflow_dispatch:
    inputs:
      max_sheets:
        description: 'Number of production sheets to test'
        required: false
        default: '120'

permissions:
  contents: read

concurrency:
  group: wien-lod21-download-pacing
  cancel-in-progress: true

jobs:
  download-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Test download logic
        run: node --test wien-lod21/download-sheets.test.mjs

      - name: Download initial production subset
        env:
          MAX_SHEETS: ${{ github.event_name == 'workflow_dispatch' && inputs.max_sheets || '120' }}
        run: |
          node wien-lod21/download-sheets.mjs \
            --targets wien-lod21/targets.production.json \
            --cache-dir "$RUNNER_TEMP/wien-lod21-download-cache" \
            --summary "$RUNNER_TEMP/lod21-download-report.json" \
            --limit "$MAX_SHEETS" \
            --parallel 2 \
            --interval-ms 1500 \
            --attempts 3 \
            --threshold 2 \
            --cooldown-ms 90000 \
            --max-cooldowns 2

      - name: Re-run to verify cache reuse
        env:
          MAX_SHEETS: ${{ github.event_name == 'workflow_dispatch' && inputs.max_sheets || '120' }}
        run: |
          node wien-lod21/download-sheets.mjs \
            --targets wien-lod21/targets.production.json \
            --cache-dir "$RUNNER_TEMP/wien-lod21-download-cache" \
            --summary "$RUNNER_TEMP/lod21-cache-report.json" \
            --limit "$MAX_SHEETS"

      - name: Write summary
        if: always()
        run: |
          node --input-type=module <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          import fs from "node:fs";
          for (const name of ["lod21-download-report.json", "lod21-cache-report.json"]) {
            const file = process.env.RUNNER_TEMP + "/" + name;
            if (!fs.existsSync(file)) continue;
            const a = JSON.parse(fs.readFileSync(file, "utf8"));
            console.log("### " + name);
            console.log("requested=" + a.requested + ", downloaded=" + a.downloaded +
              ", reused=" + a.cached + ", failed=" + a.failed.length +
              ", skipped=" + a.skipped + ", cooldowns=" + a.cooldowns +
              ", success=" + a.success);
          }
          NODE

      - name: Upload JSON reports (no downloaded ZIPs)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wien-lod21-download-pacing-report
          path: |
            ${{ runner.temp }}/lod21-download-report.json
            ${{ runner.temp }}/lod21-cache-report.json
          if-no-files-found: warn
          retention-days: 7
