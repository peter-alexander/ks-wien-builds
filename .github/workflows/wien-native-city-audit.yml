name: Audit clean Vienna-wide native 3D building baseline

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wien-native-city-audit.yml'

permissions:
  contents: read

# This is the clean FMZK-provenance native baseline, NOT a gh-pages publication.
# No Maptoolkit/Cesium and no data or private Actions-minute expenses.
concurrency:
  group: wien-native-city-audit
  cancel-in-progress: false

jobs:
  city-shards:
    name: Z15 original FMZK city audit shard ${{ matrix.shard }}/8
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install geometry build dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm install --no-save --ignore-scripts --no-audit --no-fund @mapbox/vector-tile@3.0.0 pbf@5.1.2 three@0.186.1
      - name: Test stable geometry indices, incremental patching and citywide coverage
        if: matrix.shard == 0
        run: |
          node --test wien-native-city/build.test.mjs wien-native-city/aggregate.test.mjs wien-native-city/native-tile-patch.test.mjs
      - name: Build and verify every tile in this city shard
        run: node --max-old-space-size=4096 wien-native-city/build.mjs --shard ${{ matrix.shard }} --shards 8
      - name: Always collect diagnostic reports (including failures)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: wien-native-city-report-${{ matrix.shard }}
          path: |
            wien-native-city/build/shard-${{ matrix.shard }}/plan.json
            wien-native-city/build/shard-${{ matrix.shard }}/report.json
          if-no-files-found: warn
          retention-days: 7
      - name: Retain all tested but unpublished compressed Z15 tiles
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: wien-native-city-tiles-${{ matrix.shard }}
          path: wien-native-city/build/shard-${{ matrix.shard }}/output/tiles/
          compression-level: 0
          if-no-files-found: error
          retention-days: 3

  city-acceptance:
    name: Verify complete Vienna FMZK Z15 dataset and emit aggregate stats
    needs: city-shards
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Read every shard coverage and statistics report
        uses: actions/download-artifact@v8
        with:
          pattern: wien-native-city-report-*
          path: wien-native-city/reports
          merge-multiple: false
      - name: Reject missing tiles or inconsistent official-source snapshots
        run: node wien-native-city/aggregate.mjs wien-native-city/reports
      - name: Preserve complete citywide quality and size report
        uses: actions/upload-artifact@v6
        with:
          name: wien-native-city-final-report
          path: wien-native-city/reports/city-report.json
          if-no-files-found: error
          retention-days: 30
