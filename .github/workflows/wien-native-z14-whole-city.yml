name: Build complete native Vienna Z14 LOD1 from official FMZK
run-name: Native Z14 entire Vienna (200 FMZK vector tiles)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wien-native-z14-whole-city.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wien-native-z14-whole-city
  cancel-in-progress: false

jobs:
  build:
    name: Complete Z14 LOD1, 200 original FMZK tile sources
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v7
        with:
          path: sources
      - uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: pages
          filter: blob:none
          sparse-checkout: |
            WienBuildings/LOD1
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: sources/package-lock.json
      - name: Install existing native triangulation tools
        working-directory: sources
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm install --no-save --ignore-scripts --no-audit --no-fund @mapbox/vector-tile@3.0.0 pbf@5.1.2 three@0.186.1
      - name: Verify zoom-aware native build and source coverage
        working-directory: sources
        run: |
          node --check wien-native-city/build-lowzoom-city.mjs
          node --test wien-native-city/build-lowzoom.test.mjs wien-native-city/build-lowzoom-city.test.mjs
      - name: Build all 200 officially published Z14 FMZK tiles into pretriangulated LOD1
        working-directory: sources
        run: |
          node --max-old-space-size=6144 wien-native-city/build-lowzoom-city.mjs \
            ../pages/WienBuildings/LOD1 14 wien-native-city/build/z14-all
      - name: Verify 200 current-source native Z14 tiles and full shape counts
        working-directory: sources
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import {createHash} from "node:crypto";
          import {readNativeTile} from "./wien-native-city/native-tile-patch.mjs";
          const root="wien-native-city/build/z14-all";
          const manifest=JSON.parse(fs.readFileSync(root+"/manifest.json","utf8"));
          if(manifest.zoom!==14||manifest.source!=="current-official-fmzk-lod1"||
            Object.keys(manifest.tiles).length!==200)throw new Error("Incomplete native Z14 release");
          let parts=0,triangles=0,bytes=0;
          for(const [key,metric] of Object.entries(manifest.tiles)){
            const binary=fs.readFileSync(root+"/tiles/"+key+".bin.gz");
            if(createHash("sha256").update(binary).digest("hex")!==metric.sha256)
              throw new Error("Native Z14 tile hash mismatch: "+key);
            const decoded=readNativeTile(binary);
            if(decoded.parts.length!==metric.buildingParts ||
              decoded.parts.some(p=>p.info.source!=="lod1"))
              throw new Error("Invalid FMZK Z14 building source: "+key);
            parts+=decoded.parts.length;
            triangles+=metric.triangles;
            bytes+=binary.length;
          }
          if(parts!==manifest.parts||triangles!==manifest.triangles||
            bytes!==manifest.gzipBytes)throw new Error("Z14 totals inconsistent");
          console.log("Z14 complete validated:",JSON.stringify({
            tiles:200,parts,triangles,vertices:manifest.vertices,gzipBytes:bytes
          }));
          NODE
      - name: Retain complete but unpublished Z14 native building release
        uses: actions/upload-artifact@v6
        with:
          name: wien-native-z14-lod1-whole-city-200-tiles
          path: sources/wien-native-city/build/z14-all/
          retention-days: 21
          compression-level: 0
          if-no-files-found: error
