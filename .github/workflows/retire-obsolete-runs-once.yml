name: Retire failed legacy native build runs
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/retire-obsolete-runs-once.yml'
permissions:
  actions: write
  contents: read
jobs:
  cancel:
    runs-on: ubuntu-24.04
    steps:
      - name: Cancel old failing CityGML overload and superseded queued verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for id in 42015053198 42017156858; do
            gh api -X POST "repos/${{ github.repository }}/actions/runs/$id/cancel" || true
          done
