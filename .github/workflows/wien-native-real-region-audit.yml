name: Audit real Z15 Vienna region anchors and incremental patches

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wien-native-real-region-audit.yml'
      - 'wien-native-city/audit-native-region.mjs'
      - 'wien-native-city/native-tile-patch.mjs'

permissions:
  contents: read
  actions: read

concurrency:
  group: wien-native-real-region-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate audit code syntax
        run: node --check wien-native-city/audit-native-region.mjs
      - name: Download the verified 64-tile original-roof region, not the original ZIPs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 41900416698 --repo "${{ github.repository }}" \
            --name wien-native-roof-region-2234-1420 --dir /tmp/wien-native-real-region
      - name: Inspect actual binary geometry and patch a changed building part
        run: |
          node wien-native-city/audit-native-region.mjs \
            /tmp/wien-native-real-region \
            /tmp/wien-native-real-region-audit.json
      - name: Reconcile complete real region and verify no geometry changes
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs/promises";
          import path from "node:path";
          import assert from "node:assert/strict";
          import {readNativeTile} from "./wien-native-city/native-tile-patch.mjs";
          import {reconcileNativeAnchors} from "./wien-native-city/canonical-native-anchors.mjs";
          import {auditNativeRegion} from "./wien-native-city/audit-native-region.mjs";
          const source="/tmp/wien-native-real-region";
          const dest="/tmp/wien-native-canonical-region";
          const manifest=JSON.parse(await fs.readFile(path.join(source,"manifest.json"),"utf8"));
          const tiles=new Map();
          for(const [key,metric] of Object.entries(manifest.tiles)){
            tiles.set(key,{metric,binary:await fs.readFile(path.join(source,"tiles",key+".bin.gz"))});
          }
          const normalized=reconcileNativeAnchors(tiles);
          assert.ok(normalized.changedTiles>0,"Expected the previous pilot to have anchor differences");
          await fs.mkdir(dest,{recursive:true});
          for(const [key,record] of normalized.tiles){
            const filename=path.join(dest,"tiles",key+".bin.gz");
            await fs.mkdir(path.dirname(filename),{recursive:true});
            await fs.writeFile(filename,record.binary);
            const before=readNativeTile(tiles.get(key).binary).parts;
            const after=readNativeTile(record.binary).parts;
            assert.equal(after.length,before.length);
            for(let i=0;i<before.length;i++){
              assert.deepEqual(after[i].vertices,before[i].vertices);
              assert.deepEqual(after[i].indices,before[i].indices);
            }
          }
          manifest.tiles=Object.fromEntries([...normalized.tiles].map(([key,r])=>[
            key,{...r.metric,sha256:r.sha256,gzipBytes:r.binary.length}
          ]));
          manifest.gzipBytes=normalized.totalBytes;
          await fs.writeFile(path.join(dest,"manifest.json"),JSON.stringify(manifest));
          const audit=await auditNativeRegion(dest);
          assert.equal(audit.anchorDisagreements,0,
            "All parts of each logical building must share one world-space anchor");
          assert.equal(audit.realTilePatchVerified,true);
          const report={before:{anchorDisagreements:normalized.anchorDisagreements},
            reconciliation:{affectedIdentities:normalized.affectedIdentities,
              correctedParts:normalized.correctedParts,changedTiles:normalized.changedTiles},
            after:audit};
          await fs.writeFile("/tmp/wien-native-anchor-reconciliation.json",
            JSON.stringify(report,null,"\\t")+"\\n");
          console.log(JSON.stringify(report));
          NODE
      - name: Index real canonical Z15 geometries and verify incremental change classification
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs/promises";
          import path from "node:path";
          import assert from "node:assert/strict";
          import {readNativeTile,writeNativeTile} from "./wien-native-city/native-tile-patch.mjs";
          import {indexNativeTiles,serializeNativeBuildingIndex,
            readNativeBuildingIndex,diffNativeBuildingIndexes} from "./wien-native-city/building-index.mjs";
          const root="/tmp/wien-native-canonical-region";
          const manifest=JSON.parse(await fs.readFile(path.join(root,"manifest.json"),"utf8"));
          const tiles=new Map();
          for(const [key,metric] of Object.entries(manifest.tiles)){
            tiles.set(key,{metric,binary:await fs.readFile(path.join(root,"tiles",key+".bin.gz"))});
          }
          const before=indexNativeTiles(tiles);
          assert.equal(before.buildingParts,94300);
          const roofs=Object.entries(before.buildings)
            .filter(([id,group])=>group.source==="lod21");
          assert.ok(roofs.length>9000,"Unexpected loss of roof lineage");
          for(const [id,group] of roofs){
            assert.ok(group.replacesKsIds.length>0,"Roof has no replaced FMZK identities: "+id);
          }
          for(const [ksId,roofId] of Object.entries(before.replacedBy)){
            assert.ok(before.buildings[roofId].replacesKsIds.includes(ksId),
              "Broken bidirectional FMZK replacement index: "+ksId);
          }
          assert.equal(before.tileCount,64);
          const packed=serializeNativeBuildingIndex(before);
          assert.deepEqual(readNativeBuildingIndex(packed.gzip),before);
          const noChange=diffNativeBuildingIndexes(before,before);
          assert.equal(noChange.affectedTiles.length,0);
          const [selectedTile,selectedRecord]=[...tiles][0];
          const decoded=readNativeTile(selectedRecord.binary);
          const removed=decoded.parts[0];
          const changed={...removed,info:{...removed.info},
            vertices:Buffer.from(removed.vertices),indices:Buffer.from(removed.indices)};
          const height=changed.vertices.readUInt16LE(4);
          changed.vertices.writeUInt16LE((height+1)%65536,4);
          const modified=new Map(tiles);
          modified.set(selectedTile,{...selectedRecord,
            binary:writeNativeTile([changed,...decoded.parts.slice(1)]).compressed});
          const after=indexNativeTiles(modified);
          const delta=diffNativeBuildingIndexes(before,after);
          assert.equal(delta.added.length,0);
          assert.equal(delta.removed.length,0);
          assert.equal(delta.changed.length,1);
          assert.ok(delta.affectedTiles.includes(selectedTile));
          const report={sourceTiles:64,sourceBuildingParts:before.buildingParts,
            buildingCount:before.buildingCount,indexBytes:packed.compressedBytes,
            unmodifiedAffectedTiles:noChange.affectedTiles.length,
            modifiedBuildingCount:delta.changed.length,
            affectedTiles:delta.affectedTiles,
            replacedFmzkCount:Object.keys(before.replacedBy).length,
            historicalRoofBuildingCount:roofs.length,
            sourceLineagePresent:Object.values(before.buildings)
              .filter(group=>group.source==="lod21"&&group.sourceSheets.length>0).length};
          await fs.writeFile("/tmp/wien-native-building-index-audit.json",
            JSON.stringify(report,null,"\\t")+"\\n");
          console.log(JSON.stringify(report));
          NODE
      - name: Retain real-region building index audit
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: wien-native-building-index-audit
          path: /tmp/wien-native-building-index-audit.json
          retention-days: 14
          if-no-files-found: warn
      - name: Retain verified real-region canonical anchor report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: wien-native-anchor-reconciliation
          path: /tmp/wien-native-anchor-reconciliation.json
          retention-days: 14
          if-no-files-found: warn
      - name: Keep complete anchor-disagreement and patch-verification report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: wien-native-real-region-audit
          path: /tmp/wien-native-real-region-audit.json
          retention-days: 14
          if-no-files-found: warn
