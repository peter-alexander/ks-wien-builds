name: Test native Vienna 3D source lineage and incremental binary patches

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wien-native-incremental-tests.yml'
      - 'wien-native-city/source-state.mjs'
      - 'wien-native-city/source-state.test.mjs'
      - 'wien-native-city/incremental-plan.mjs'
      - 'wien-native-city/incremental-plan.test.mjs'
      - 'wien-native-city/native-tile-patch.mjs'
      - 'wien-native-city/native-tile-patch.test.mjs'
      - 'wien-lod21/download-sheets.mjs'
      - 'wien-lod21/download-sheets.test.mjs'
      - 'wien-native-pilot/build.mjs'
      - 'wien-native-pilot/build.test.mjs'
      - 'wien-native-pilot/build-roof-targets.mjs'
      - 'wien-optimized/src/app/buildings/wien-ogd-fallback-geometry.js'

permissions:
  contents: read

concurrency:
  group: wien-native-incremental-ci
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install test dependencies without downloading source CityGML data
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm install --no-save --ignore-scripts --no-audit --no-fund @mapbox/vector-tile@3.0.0 pbf@5.1.2 three@0.186.1
      - name: Verify JS syntax and geometry cache integrity
        run: |
          node --check wien-native-city/native-tile-patch.mjs
          node --check wien-native-city/incremental-plan.mjs
          node --check wien-native-city/source-state.mjs
          node --check wien-native-pilot/build.mjs
          node --check wien-native-pilot/build-roof-targets.mjs
          node --test wien-native-city/source-state.test.mjs wien-native-city/incremental-plan.test.mjs wien-native-city/native-tile-patch.test.mjs wien-native-pilot/build.test.mjs wien-lod21/download-sheets.test.mjs
