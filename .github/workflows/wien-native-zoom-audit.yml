name: Audit Z14 and Z13 simplification from verified Vienna Z15 buildings
run-name: Assess Z14/Z13 complexity without re-downloading CityGML

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wien-native-zoom-audit.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: wien-native-zoom-audit
  cancel-in-progress: false

jobs:
  inspect:
    name: Audit Z14 and Z13 from 678 verified Z15 tiles
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Test zoom transformation and simplify-safe geometry boundaries
        run: |
          node --check wien-native-city/zoom-aggregate-audit.mjs
          node --test wien-native-city/zoom-aggregate-audit.test.mjs
      - name: Restore successful complete Z15 release, not historical original CityGML files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 41904116043 --repo "${{ github.repository }}" \
            --name wien-native-z15-whole-city-678-tiles \
            --dir /tmp/wien-native-z15
      - name: Analyze every Z14 parent tile without changing geometry
        run: |
          node --max-old-space-size=6144 wien-native-city/zoom-aggregate-audit.mjs \
            /tmp/wien-native-z15 14 /tmp/wien-z14-audit.json
      - name: Analyze every Z13 parent tile without changing geometry
        run: |
          node --max-old-space-size=6144 wien-native-city/zoom-aggregate-audit.mjs \
            /tmp/wien-native-z15 13 /tmp/wien-z13-audit.json
      - name: Retain both full-city zoom complexity reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: wien-native-z14-z13-geometry-audit
          path: |
            /tmp/wien-z14-audit.json
            /tmp/wien-z13-audit.json
          retention-days: 21
          if-no-files-found: warn
