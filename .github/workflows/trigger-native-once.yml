name: One-time dispatch of verified native Vienna production pipeline
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/trigger-native-once.yml'
permissions:
  actions: write
  contents: read
jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - name: Start the existing unified production workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/actions/workflows/wien-native-production.yml/dispatches" \
            -f ref=main
