name: Build one audited Vienna 8x8 native roof region from original CityGML

on:
  workflow_dispatch:
    inputs:
      region:
        description: 'Audited 8x8 Z15 region (e.g. 2234-1420)'
        required: true
        default: '2234-1420'
        type: string
  push:
    branches: [main]
    paths:
      - '.github/workflows/wien-native-region.yml'
      - 'wien-native-city/region-plan.mjs'
      - 'wien-native-city/roof-inventory.snapshot.json'
      - 'wien-lod21/split-download-manifest.mjs'

permissions:
  contents: read

concurrency:
  group: wien-native-region-${{ inputs.region || '2234-1420' }}
  cancel-in-progress: false

jobs:
  plan-sources:
    name: Plan bounded CityGML download packages
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      shards: ${{ steps.plan.outputs.shards }}
    env:
      REGION: ${{ inputs.region || '2234-1420' }}
    steps:
      - uses: actions/checkout@v7
      - name: Limit every source job to six downloads
        id: plan
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import {makeRegionPlan} from "./wien-native-city/region-plan.mjs";
          const inventory=JSON.parse(fs.readFileSync("wien-native-city/roof-inventory.snapshot.json","utf8"));
          const region=makeRegionPlan(inventory,process.env.REGION);
          const shards=Math.ceil(region.sourceSheets.length/6);
          if(shards<1 || shards>64)throw new Error("Invalid source shard count: "+shards);
          fs.appendFileSync(process.env.GITHUB_OUTPUT,
            "matrix="+JSON.stringify({shard:Array.from({length:shards},(_,i)=>i)})+"\n"+
            "shards="+shards+"\n");
          console.log(region.region,region.sourceSheets.length,"original sheets across",shards,
            "jobs (at most six sheets/job; max-parallel remains four)");
          NODE

  original-sources:
    needs: plan-sources
    name: Original CityGML ${{ inputs.region || '2234-1420' }} batch ${{ matrix.shard }}/${{ needs.plan-sources.outputs.shards }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan-sources.outputs.matrix) }}
    env:
      REGION: ${{ inputs.region || '2234-1420' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Check CityGML revision cache and deterministic source assignment
        if: matrix.shard == 0
        run: node --test wien-lod21/download-sheets.test.mjs wien-lod21/split-download-manifest.test.mjs wien-native-city/region-plan.test.mjs

      - name: Plan verified 8x8 FMZK region sources
        run: |
          node wien-native-city/region-plan.mjs --region "$REGION" --out "wien-native-city/build/region-$REGION"

      - name: Select disjoint original CityGML source batch
        run: |
          node wien-lod21/split-download-manifest.mjs \
            --manifest "wien-native-city/build/region-$REGION/sources.json" \
            --shard ${{ matrix.shard }} --shards ${{ needs.plan-sources.outputs.shards }}

      - name: Restore already-verified original CityGML ZIPs and validators
        uses: actions/cache/restore@v6
        with:
          path: wien-native-city/build/region-${{ env.REGION }}/shard-${{ matrix.shard }}/downloads
          key: wien-citygml-region-${{ env.REGION }}-s${{ needs.plan-sources.outputs.shards }}-${{ matrix.shard }}-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            wien-citygml-region-${{ env.REGION }}-s${{ needs.plan-sources.outputs.shards }}-${{ matrix.shard }}-v2-

      - name: Download missing/new original CityGML 500m source ZIPs
        run: |
          node wien-lod21/download-sheets.mjs \
            --targets "wien-native-city/build/roof-sector/shard-${{ matrix.shard }}/targets.json" \
            --cache-dir "wien-native-city/build/region-$REGION/shard-${{ matrix.shard }}/downloads" \
            --summary "wien-native-city/build/region-$REGION/shard-${{ matrix.shard }}/report.json" \
            --revalidate strict \
            --missing-policy confirmed-404 \
            --parallel 1 \
            --interval-ms 2500 \
            --attempts 4 \
            --threshold 3 \
            --cooldown-ms 90000 \
            --max-cooldowns 2 \
            --retry-ms 5000

      - name: Save valid original archives even if source server loses connections
        if: always()
        uses: actions/cache/save@v6
        with:
          path: wien-native-city/build/region-${{ env.REGION }}/shard-${{ matrix.shard }}/downloads
          key: wien-citygml-region-${{ env.REGION }}-s${{ needs.plan-sources.outputs.shards }}-${{ matrix.shard }}-v2-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Provide complete source ZIPs only to the same build run
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: wien-region-${{ env.REGION }}-source-${{ matrix.shard }}
          path: wien-native-city/build/region-${{ env.REGION }}/shard-${{ matrix.shard }}/downloads/
          retention-days: 3
          compression-level: 0
          if-no-files-found: error

      - name: Retain compact per-batch diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: wien-region-${{ env.REGION }}-source-report-${{ matrix.shard }}
          path: wien-native-city/build/region-${{ env.REGION }}/shard-${{ matrix.shard }}/report.json
          retention-days: 7
          if-no-files-found: warn

  native-geometry:
    needs: original-sources
    name: Build geometry and metadata for audited native region
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      REGION: ${{ inputs.region || '2234-1420' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install original geometry and native source dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm install --no-save --ignore-scripts --no-audit --no-fund @mapbox/vector-tile@3.0.0 pbf@5.1.2 three@0.186.1

      - name: Read deterministic original CityGML sheets and 4x4 quadrants
        run: |
          node wien-native-city/region-plan.mjs --region "$REGION" --out "wien-native-city/build/region-$REGION"

      - name: Restore all 16 complete original CityGML download batches
        uses: actions/download-artifact@v8
        with:
          pattern: wien-region-${{ env.REGION }}-source-*
          path: wien-native-city/build/region-${{ env.REGION }}/downloads
          merge-multiple: true

      - name: Collect verified source-only metadata, without retaining ZIPs in final tiles
        run: |
          set -euo pipefail
          root="wien-native-city/build/region-$REGION"
          node wien-native-city/source-state.mjs \
            "$root/sources.json" "$root/downloads" "$root/source-state.json"
          find "$root/downloads" -name '*_lod2_gml.zip' -print0 |
            while IFS= read -r -d '' archive; do
              unzip -tqq "$archive" >/dev/null
            done
          mkdir -p "$root/source"
          find "$root/downloads" -name '*_lod2_gml.zip' -print0 |
            while IFS= read -r -d '' archive; do
              unzip -oq "$archive" -d "$root/source"
            done

      - name: Match and triangulate one 4x4 FMZK quadrant at a time
        run: |
          set -euo pipefail
          root="wien-native-city/build/region-$REGION"
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const root="wien-native-city/build/region-"+process.env.REGION;
          const plan=JSON.parse(fs.readFileSync(root+"/plan.json"));
          for(let i=0;i<plan.quadrants.length;i++){
            fs.writeFileSync(root+"/quadrant-"+i+".json",JSON.stringify(plan.quadrants[i]));
          }
          NODE
          for i in $(seq 0 3); do
            if [[ ! -f "$root/quadrant-$i.json" ]]; then continue; fi
            mkdir -p "$root/quadrant-$i"
            REGION_ROOT="$root" QUADRANT="$i" node --max-old-space-size=4096 --input-type=module <<'NODE'
          import fs from "node:fs";
          import {collectCurrentGroups,matchCityGml} from "./wien-native-pilot/build-roof-targets.mjs";
          const root=process.env.REGION_ROOT;
          const i=process.env.QUADRANT;
          const quadrant=JSON.parse(fs.readFileSync(root+"/quadrant-"+i+".json"));
          const groups=await collectCurrentGroups({keys:quadrant.tileKeys});
          console.log("Matching",quadrant.id,quadrant.tileKeys.length,"tiles, current groups:",groups.size);
          const result=await matchCityGml({
            groups,
            sourceDir:root+"/source",
            targetsFile:root+"/quadrant-"+i+"/roof-targets.json",
            auditFile:root+"/quadrant-"+i+"/roof-matching-audit.json"
          });
          console.log("Original matches in quadrant",quadrant.id,result.targets.length);
          NODE
            targets=$(node -e "console.log(require('./$root/quadrant-$i/roof-targets.json').buildings.length)")
            if [[ "$targets" -eq 0 ]]; then
              WIEN_NATIVE_OUTPUT_DIR="$root/quadrant-$i/Native" \
                REGION_ROOT="$root" QUADRANT="$i" node --max-old-space-size=4096 --input-type=module <<'NODE'
          import fs from "node:fs";
          import {buildPilot} from "./wien-native-pilot/build.mjs";
          const root=process.env.REGION_ROOT,i=process.env.QUADRANT;
          const quadrant=JSON.parse(fs.readFileSync(root+"/quadrant-"+i+".json"));
          await buildPilot({outputDir:root+"/quadrant-"+i+"/Native",
            tileKeys:quadrant.tileKeys,fmzkOnly:true});
          NODE
            else
              node --max-old-space-size=4096 --expose-gc wien-lod21/build.mjs \
                --input "$root/source" \
                --output "$root/quadrant-$i/LOD21" \
                --targets "$root/quadrant-$i/roof-targets.json"
              REGION_ROOT="$root" QUADRANT="$i" node --max-old-space-size=4096 --input-type=module <<'NODE'
          import fs from "node:fs";
          import {buildPilot} from "./wien-native-pilot/build.mjs";
          const root=process.env.REGION_ROOT,i=process.env.QUADRANT;
          const quadrant=JSON.parse(fs.readFileSync(root+"/quadrant-"+i+".json"));
          await buildPilot({outputDir:root+"/quadrant-"+i+"/Native",
            tileKeys:quadrant.tileKeys,
            localRoofDirectory:root+"/quadrant-"+i+"/LOD21",
            localRoofTargets:root+"/quadrant-"+i+"/roof-targets.json"});
          NODE
            fi
          done

      - name: Verify every native Z15 tile was written exactly once and is independently decodable
        run: |
          node --max-old-space-size=4096 --input-type=module <<'NODE'
          import fs from "node:fs";
          import path from "node:path";
          import {readNativeTile} from "./wien-native-city/native-tile-patch.mjs";
          const root="wien-native-city/build/region-"+process.env.REGION;
          const plan=JSON.parse(fs.readFileSync(root+"/plan.json"));
          const all=new Map();
          let roofs=0,parts=0,bytes=0;
          for(let i=0;i<plan.quadrants.length;i++){
            const manifest=JSON.parse(fs.readFileSync(root+"/quadrant-"+i+"/Native/manifest.json"));
            if(manifest.sourceReleases.lod1!==plan.fmzkRelease)throw new Error("Mixed FMZK releases in region");
            for(const [key,metric] of Object.entries(manifest.tiles)){
              if(all.has(key))throw new Error("Duplicate output tile "+key);
              const file=path.join(root,"quadrant-"+i,"Native","tiles",key+".bin.gz");
              const binary=fs.readFileSync(file);
              const native=readNativeTile(binary);
              if(native.parts.length!==metric.buildingParts)throw new Error("Native part count mismatch "+key);
              const historical=native.parts.filter(p=>p.info.source==="lod21");
              if(historical.length!==metric.lod21Parts ||
                historical.some(p=>!p.info.sourceSheets?.length)){
                throw new Error("Untraceable historical CityGML roof in "+key);
              }
              all.set(key,{metric,file,sha256:(await import("node:crypto"))
                .createHash("sha256").update(binary).digest("hex")});
              roofs+=historical.length;
              parts+=native.parts.length;
              bytes+=binary.length;
            }
          }
          if(all.size!==plan.tiles.length || plan.tiles.some(key=>!all.has(key))){
            throw new Error("Native region tiles do not cover every official FMZK source tile");
          }
          const out=path.join(root,"NativeRegion");
          fs.mkdirSync(path.join(out,"tiles"),{recursive:true});
          const tileManifest={};
          for(const [key,record] of all){
            const target=path.join(out,"tiles",key+".bin.gz");
            fs.mkdirSync(path.dirname(target),{recursive:true});
            fs.copyFileSync(record.file,target);
            tileManifest[key]={...record.metric,sha256:record.sha256};
          }
          fs.copyFileSync(path.join(root,"source-state.json"),path.join(out,"source-state.json"));
          fs.writeFileSync(path.join(out,"manifest.json"),JSON.stringify({
            schemaVersion:2,format:"KSWN0001",region:plan.region,
            sourceRelease:plan.fmzkRelease,sourceSheetCount:plan.sourceSheets.length,
            tiles:tileManifest,parts,roofs,gzipBytes:bytes
          },null,"\t")+"\n");
          console.log(JSON.stringify({region:plan.region,tiles:all.size,
            sourceSheets:plan.sourceSheets.length,parts,roofs,bytes}));
          NODE

      - name: Publish only audited region artifact (no automatic gh-pages replacement)
        uses: actions/upload-artifact@v6
        with:
          name: wien-native-roof-region-${{ env.REGION }}
          path: wien-native-city/build/region-${{ env.REGION }}/NativeRegion/
          compression-level: 0
          retention-days: 14
          if-no-files-found: error

      - name: Retain original roof matching diagnostics on build failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: wien-native-roof-region-${{ env.REGION }}-diagnostics
          path: |
            wien-native-city/build/region-${{ env.REGION }}/source-state.json
            wien-native-city/build/region-${{ env.REGION }}/quadrant-*/roof-matching-audit.json
          if-no-files-found: warn
          retention-days: 7
