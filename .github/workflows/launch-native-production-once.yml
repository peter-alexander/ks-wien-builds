name: Launch native Vienna full production build once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/launch-native-production-once.yml'
permissions:
  actions: write
  contents: read
jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch verified native Z13-Z15 production
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/actions/workflows/wien-native-production.yml/dispatches" -f ref=main
