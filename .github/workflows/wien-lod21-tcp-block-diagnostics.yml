name: Diagnose LOD2.1 TCP blocking across runners

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wien-lod21-tcp-block-diagnostics
  cancel-in-progress: true

jobs:
  linux-load:
    name: Linux load and post-failure recovery probes
    runs-on: ubuntu-24.04
    timeout-minutes: 19
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
      - name: Syntax check
        run: node --check wien-lod21/diagnose-tcp-block.mjs
      - name: Reproduce TCP block, then test recovery at 0, 120, 300 and 600 seconds
        env:
          DIAG_OUTPUT: ${{ runner.temp }}/lod21-linux-network.json
        run: node wien-lod21/diagnose-tcp-block.mjs load
      - name: Upload Linux metrics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lod21-linux-network-diagnostics
          path: ${{ runner.temp }}/lod21-linux-network.json
          retention-days: 7
          if-no-files-found: warn

  windows-observer:
    name: Windows independent-runner reachability control
    runs-on: windows-2025
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
      - name: Syntax check
        run: node --check wien-lod21/diagnose-tcp-block.mjs
      - name: Passive probe every 45 seconds for 12 minutes
        env:
          DIAG_OUTPUT: ${{ runner.temp }}/lod21-windows-network.json
        run: node wien-lod21/diagnose-tcp-block.mjs observe
      - name: Upload Windows metrics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lod21-windows-network-diagnostics
          path: ${{ runner.temp }}/lod21-windows-network.json
          retention-days: 7
          if-no-files-found: warn
